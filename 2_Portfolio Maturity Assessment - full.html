:root {
  color-scheme: light;
  --orange: #EC6602;
  --orange-dark: #C7530A;
  --orange-light: #FFF6EF;
  --teal: #00B5AE;
  --teal-dark: #008784;
  --teal-light: #E6F7F6;
  --sh-teal: #009999;
  --text: #1A1A1A;
  --text-muted: #5A5A5A;
  --text-faded: #8A8A8A;
  --border: #DCDCDC;
  --border-strong: #B5B5B5;
  --bg: #FFFFFF;
  --bg-soft: #F7F7F7;
  --bg-card: #FFFFFF;
  --bg-panel: #F1F1F1;
  --shadow: 0 1px 2px rgba(0,0,0,0.04);
}

/* Brand font stacks
   SH-Bree-Headline and Calibri are proprietary; if they aren't installed
   the browser falls back to the closest visually-matching options. */
:root {
  --font-body: "Carlito", "Calibri", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-head: "SH-Bree-Headline", "SH Bree Headline", "Bree", "Poppins",
               "Trebuchet MS", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--orange-dark); }

/* ---------- Header ---------- */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  border-bottom: 1px solid #ECECEC;
  box-shadow: 0 1px 0 rgba(0,0,0,0.02);
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 18px 36px 10px 36px;
  background: var(--bg);
  border-bottom: 1px solid transparent;
}

.brand-left {
  display: flex;
  flex-direction: column;
}
.brand-title {
  font-family: var(--font-head);
  font-size: 26px;
  font-weight: 700;
  color: var(--orange);
  letter-spacing: -0.015em;
  line-height: 1.1;
}
.brand-subtitle {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 700;
  color: #111;
  letter-spacing: -0.015em;
  margin-top: 2px;
  line-height: 1.1;
}

.brand-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.brand-logo {
  text-align: right;
  line-height: 1;
  padding-top: 4px;
}
.brand-logo .row1 {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--sh-teal);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.03em;
  display: block;
}
.brand-logo .row2 {
  font-family: var(--font-head);
  color: var(--orange);
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -0.01em;
  display: block;
  margin-top: 1px;
}
.brand-logo .row2 .reg {
  font-size: 7px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 400;

/* =========================================================
   STATE + STORAGE
   ========================================================= */
const STORAGE_KEY = "pmma_full_state_v1";
const SUBMISSIONS_KEY = "pmma_full_submissions_v1";

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) {}
  return defaultState();
}
function defaultState() {
  return {
    sectionIdx: 0,
    responses: {},        // questionId -> { value, valueIndex, valueText }
    hovered: {},          // questionId -> hovered option index (transient, but we persist for re-render)
    viewMode: "form"      // "form" | "results"
  };
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getSubmissions() {
  try { return JSON.parse(localStorage.getItem(SUBMISSIONS_KEY) || "[]"); } catch (e) { return []; }
}
function setSubmissions(arr) {
  localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(arr));
}

/* =========================================================
   HELPERS
   ========================================================= */
function totalCountableQuestions() {
  let total = 0;
  DATA.sections.forEach(s => {
    if (!s.count) return;
    s.questions.forEach(q => {
      if (q.optional) return;
      total++;
    });
  });
  return total;
}
function answeredInSection(s) {
  if (!s.questions) return 0;
  return s.questions.filter(q => {
    if (q.optional) return false;
    const r = state.responses[q.id];
    if (!r) return false;
    if (q.kind === "text") return !!(r.valueText && r.valueText.trim());
    if (q.kind === "textarea") return !!(r.valueText && r.valueText.trim());
    if (q.kind === "scale_0_10") return typeof r.value === "number";
    if (q.kind === "multi") return Array.isArray(r.valueIndices) && r.valueIndices.length > 0;
    return typeof r.valueIndex === "number";
  }).length;
}
function sectionCountableTotal(s) {
  if (!s.questions) return 0;
  return s.questions.filter(q => !q.optional).length;
}
function totalAnswered() {
  let n = 0;
  DATA.sections.forEach(s => { if (s.count) n += answeredInSection(s); });
  return n;
}

function setResponse(qid, patch) {
  state.responses[qid] = Object.assign({}, state.responses[qid] || {}, patch);
  saveState();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1700);
}

/* =========================================================
   RENDER
   ========================================================= */
function render(opts) {
  const navTriggered = opts && opts.fromNav;
  renderSidebar();
  renderProgress();
  const main = document.getElementById("main");
  main.innerHTML = "";

  if (state.viewMode === "results") {
    main.appendChild(renderResults());
    if (navTriggered) window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  const s = DATA.sections[state.sectionIdx];
  if (s.type === "intro") {
    main.appendChild(renderIntro());
  } else {
    main.appendChild(renderSection(s));
  }
  main.appendChild(renderFooterNav());
  // Only scroll on explicit navigation (sidebar click, Next, Previous, Results toggle).
  // Inline interactions (selecting an option, hovering, typing) leave scroll position alone.
  if (navTriggered) window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderSidebar() {
  const list = document.getElementById("sidebarList");
  list.innerHTML = "";
  DATA.sections.forEach((s, i) => {
    const li = document.createElement("li");
    li.className = "sidebar-item" + (i === state.sectionIdx && state.viewMode === "form" ? " active" : "");
    if (s.count) {
      const total = sectionCountableTotal(s);
      const ans = answeredInSection(s);
      if (ans > 0 && ans === total) li.classList.add("done");
    }
    li.innerHTML = `<span class="sidebar-item-label">${escapeHtml(s.label)}</span>` +
      (s.count ? `<span class="sidebar-item-progress">${answeredInSection(s)}/${sectionCountableTotal(s)}</span>` : "");
    li.addEventListener("click", () => {
      state.sectionIdx = i;
      state.viewMode = "form";
      saveState();
      render({ fromNav: true });
    });
    list.appendChild(li);
  });
}

function renderProgress() {
  const total = totalCountableQuestions();
  const ans = totalAnswered();
  const pct = total > 0 ? (ans / total) * 100 : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressMeta").textContent = `${ans}/${total} answered`;
  // "Back" always — toggles between form and results
  document.getElementById("btnResults").textContent = "← Back";
}

function renderIntro() {
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="section-eyebrow">SECTION 1 OF ${DATA.sections.length}</div>
    <h2 class="section-title">Introduction</h2>
    <div class="intro-box">
      <p><strong>Background:</strong> This assessment captures how the portfolio management system is experienced across different roles. Differences in responses are expected and help identify misalignment, blind spots and structural gaps.</p>
      <p><strong>Scope:</strong> Portfolio management covers all portfolio-relevant investments — initiatives and business opportunities that create new products or services, improve or extend existing offerings, reduce costs, leverage efficiencies, or develop capabilities, architectural runways and maintenance.</p>
      <p><strong>Task:</strong> Please answer based on how the process works in practice for you, not how it was designed or communicated.</p>
    </div>
    <p class="muted">The assessment has <strong>${totalCountableQuestions()} questions</strong> across ${DATA.sections.filter(s => s.count).length} sections and takes roughly 12–15 minutes. Your answers are saved locally in your browser as you go — you can leave and come back.</p>
  `;
  return wrap;
}

function renderSection(s) {
  const wrap = document.createElement("div");
  const sectionIdx = state.sectionIdx;
  const head = document.createElement("div");
  head.innerHTML = `
    <div class="section-eyebrow">SECTION ${sectionIdx + 1} OF ${DATA.sections.length}</div>
    <h2 class="section-title">${escapeHtml(s.title || s.label)}</h2>
  `;
  wrap.appendChild(head);

  s.questions.forEach((q, qi) => {
    wrap.appendChild(renderQuestion(s, q, qi));
    if (qi < s.questions.length - 1) {
      const hr = document.createElement("hr");
      hr.className = "q-divider";
      wrap.appendChild(hr);
    }
  });
  return wrap;
}

function renderQuestion(s, q, qi) {
  const wrap = document.createElement("div");

  if (q.sub) {
    const eb = document.createElement("div");
    eb.className = "subsection-eyebrow";
    eb.textContent = q.sub;
    wrap.appendChild(eb);
  }

  const stem = document.createElement("p");
  stem.className = "q-stem";
  stem.textContent = q.stem;
  wrap.appendChild(stem);

  if (q.help) {
    const help = document.createElement("p");
    help.className = "section-intro";
    help.style.margin = "-8px 0 14px 0";
    help.textContent = q.help;
    wrap.appendChild(help);
  }

  // Different question kinds
  if (q.kind === "text") {
    const input = document.createElement("input");
    input.className = "text-input";
    input.type = "text";
    input.placeholder = q.placeholder || "";
    input.value = (state.responses[q.id] && state.responses[q.id].valueText) || "";
    input.addEventListener("input", () => {
      setResponse(q.id, { valueText: input.value });
      renderSidebar();
      renderProgress();
    });
    wrap.appendChild(input);
    return wrap;
  }

  if (q.kind === "textarea") {
    const ta = document.createElement("textarea");
    ta.className = "textarea-input";
    ta.placeholder = "Optional — share what comes to mind";
    ta.value = (state.responses[q.id] && state.responses[q.id].valueText) || "";
    ta.addEventListener("input", () => {
      setResponse(q.id, { valueText: ta.value });
    });
    wrap.appendChild(ta);
    return wrap;
  }

  if (q.kind === "scale_0_10") {
    const r = state.responses[q.id] || {};
    const scale = document.createElement("div");
    scale.className = "scale";
    for (let i = 0; i <= 10; i++) {
      const b = document.createElement("button");
      b.className = "scale-btn" + (r.value === i ? " selected" : "");
      b.textContent = i;
      b.addEventListener("click", () => {
        setResponse(q.id, { value: i });
        render();
      });
      scale.appendChild(b);
    }
    wrap.appendChild(scale);
    const labels = document.createElement("div");
    labels.className = "scale-labels";
    labels.innerHTML = `<span>${escapeHtml(q.lowLabel || "")}</span><span>${escapeHtml(q.highLabel || "")}</span>`;
    wrap.appendChild(labels);
    return wrap;
  }

  if (q.kind === "multi") {
    // Multi-select: checkboxes, full width, no definition panel
    const r = state.responses[q.id] || {};
    const picked = Array.isArray(r.valueIndices) ? new Set(r.valueIndices) : new Set();
    const opts = document.createElement("div");
    opts.className = "options multi";
    q.options.forEach((o, idx) => {
      const optEl = document.createElement("div");
      const isOn = picked.has(idx);
      optEl.className = "opt multi" + (isOn ? " selected" : "");
      optEl.innerHTML = `
        <span class="opt-check${isOn ? " on" : ""}"></span>
        <span class="opt-label">${escapeHtml(o.title)}</span>
      `;
      optEl.addEventListener("click", () => {
        if (picked.has(idx)) picked.delete(idx);
        else picked.add(idx);
        const arr = Array.from(picked).sort((a,b) => a-b);
        const titles = arr.map(i => q.options[i].title);
        setResponse(q.id, { valueIndices: arr, valueTitles: titles });
        render();
      });
      opts.appendChild(optEl);
    });
    wrap.appendChild(opts);
    return wrap;
  }

  // Default: single-select options with definition panel
  const qWrap = document.createElement("div");
  qWrap.className = "q-wrap";

  const opts = document.createElement("div");
  opts.className = "options";

  const resp = state.responses[q.id] || {};
  const selectedIdx = typeof resp.valueIndex === "number" ? resp.valueIndex : null;
  const hovered = state.hovered[q.id];

  q.options.forEach((o, idx) => {
    const isDknow = !!o.dknow;
    const tagCount = q.options.filter(x => !x.dknow).length; // typically 4
    const optEl = document.createElement("div");
    optEl.className = "opt" + (isDknow ? " dknow" : "") + (selectedIdx === idx ? " selected" : "");
    optEl.innerHTML = `
      <span class="opt-radio"></span>
      ${isDknow ? "" : `<span class="opt-tag">${idx + 1}/${tagCount}</span>`}
      <span class="opt-label">${escapeHtml(o.title)}</span>
    `;
    optEl.addEventListener("click", () => {
      setResponse(q.id, { valueIndex: idx, value: o.title });
      render();
    });
    optEl.addEventListener("mouseenter", () => {
      state.hovered[q.id] = idx;
      updateDefPanel(q, defPanel);
    });
    optEl.addEventListener("mouseleave", () => {
      state.hovered[q.id] = undefined;
      updateDefPanel(q, defPanel);
    });
    opts.appendChild(optEl);
  });

  qWrap.appendChild(opts);

  const defPanel = document.createElement("div");
  defPanel.className = "def-panel";
  updateDefPanel(q, defPanel);

  qWrap.appendChild(defPanel);
  wrap.appendChild(qWrap);
  return wrap;
}

function updateDefPanel(q, panel) {
  const r = state.responses[q.id] || {};
  const hoverIdx = state.hovered[q.id];
  const selectedIdx = typeof r.valueIndex === "number" ? r.valueIndex : null;

  let showIdx = (typeof hoverIdx === "number") ? hoverIdx : selectedIdx;
  let isLocked = (typeof hoverIdx !== "number") && (typeof selectedIdx === "number");

  panel.classList.toggle("locked", isLocked);
  panel.classList.toggle("empty", showIdx == null);

  if (showIdx == null) {
    panel.innerHTML = `
      <div class="def-panel-eyebrow">What does each option mean?</div>
      <div class="def-panel-body">Hover over an option to see its definition, or select one to lock it in here.</div>
    `;
    return;
  }
  const o = q.options[showIdx];
  panel.innerHTML = `
    <div class="def-panel-title">${escapeHtml(o.title)}</div>
    ${o.def ? `<div class="def-panel-body">${escapeHtml(o.def)}</div>` : `<div class="def-panel-body">${isLocked ? "Selected." : "Click to select."}</div>`}
  `;
}

function renderFooterNav() {
  const s = DATA.sections[state.sectionIdx];
  const wrap = document.createElement("div");
  wrap.className = "section-footer";

  const prev = document.createElement("button");
  prev.className = "btn";
  prev.innerHTML = "← Previous";
  prev.disabled = state.sectionIdx === 0;
  prev.addEventListener("click", () => {
    if (state.sectionIdx > 0) {
      state.sectionIdx -= 1;
      saveState();
      render({ fromNav: true });
    }
  });

  const counter = document.createElement("div");
  counter.className = "page-counter";
  if (s.count) {
    counter.textContent = `${answeredInSection(s)}/${sectionCountableTotal(s)} answered on this page`;
  } else {
    counter.textContent = "";
  }

  const next = document.createElement("button");
  const isLast = state.sectionIdx === DATA.sections.length - 1;
  next.className = "btn primary";
  next.innerHTML = isLast ? "See results →" : "Next Section →";
  next.addEventListener("click", () => {
    if (isLast) {
      state.viewMode = "results";
      saveState();
      render({ fromNav: true });
    } else {
      state.sectionIdx += 1;
      saveState();
      render({ fromNav: true });
    }
  });

  wrap.appendChild(prev);
  wrap.appendChild(counter);
  wrap.appendChild(next);
  return wrap;
}

/* =========================================================
   RESULTS VIEW
   ========================================================= */
function renderResults() {
  const wrap = document.createElement("div");
  wrap.className = "results-wrap";

  const total = totalCountableQuestions();
  const ans = totalAnswered();

  // Overall maturity score: avg of valueIndex+1 over countable, multiple-choice answered questions (excluding "don't know")
  let scoreSum = 0;
  let scoreN = 0;
  DATA.sections.forEach(s => {
    if (!s.count || !s.questions) return;
    s.questions.forEach(q => {
      if (q.optional) return;
      const r = state.responses[q.id];
      if (!r) return;
      if (q.kind === "scale_0_10" || q.kind === "text" || q.kind === "textarea" || q.kind === "multi") return;
      if (q.isPerceived) return;
      if (typeof r.valueIndex !== "number") return;
      const o = q.options[r.valueIndex];
      if (o && o.dknow) return;
      scoreSum += (r.valueIndex + 1);
      scoreN += 1;
    });
  });
  const avg = scoreN > 0 ? (scoreSum / scoreN) : 0;
  const satisfaction = (state.responses["satisfaction"] && typeof state.responses["satisfaction"].value === "number") ? state.responses["satisfaction"].value : null;

  wrap.innerHTML = `
    <div class="section-eyebrow">RESULTS</div>
    <h2 class="section-title">Your assessment results</h2>
    <p class="section-intro">Snapshot of where you are based on your answers. Maturity score is the average level (1–4) across the rated capability questions. Results live only in this browser unless you export or save them.</p>

    <div class="results-summary">
      <div class="summary-card">
        <div class="label">Maturity</div>
        <div class="value">${scoreN > 0 ? avg.toFixed(2) : "—"}</div>
        <div class="sub">${scoreN > 0 ? `out of 4.00 (${scoreN} rated)` : "no rated answers yet"}</div>
      </div>
      <div class="summary-card">
        <div class="label">Answered</div>
        <div class="value">${ans}/${total}</div>
        <div class="sub">${total > 0 ? Math.round(ans/total*100) : 0}% complete</div>
      </div>
      <div class="summary-card">
        <div class="label">Satisfaction</div>
        <div class="value">${satisfaction == null ? "—" : satisfaction + "/10"}</div>
        <div class="sub">overall, self-rated</div>
      </div>
      <div class="summary-card">
        <div class="label">Saved submissions</div>
        <div class="value">${getSubmissions().length}</div>
        <div class="sub">stored in this browser</div>
      </div>
    </div>

function renderSectionScores() {
  let html = "";
  DATA.sections.forEach(s => {
    if (!s.count || !s.questions) return;
    let sum = 0, n = 0;
    s.questions.forEach(q => {
      if (q.optional) return;
      const r = state.responses[q.id];
      if (!r) return;
      if (q.kind === "scale_0_10" || q.kind === "text" || q.kind === "textarea" || q.kind === "multi") return;
      if (q.isPerceived) return;
      if (typeof r.valueIndex !== "number") return;
      const o = q.options[r.valueIndex];
      if (o && o.dknow) return;
      sum += (r.valueIndex + 1);
      n++;
    });
    const avg = n > 0 ? sum / n : null;
    const pct = avg ? ((avg - 1) / 3) * 100 : 0;
    html += `
      <div class="score-row">
        <div class="name">${escapeHtml(s.label)}</div>
        <div class="score-bar"><div class="score-bar-fill" style="width:${pct}%"></div></div>
        <div class="score-num">${avg ? avg.toFixed(2) : "—"}</div>
      </div>`;
  });
  return html;
}

function renderSubmissionsList() {
  const list = document.getElementById("submissionsList");
  if (!list) return;
  const subs = getSubmissions();
  if (subs.length === 0) {
    list.innerHTML = `<p class="muted">No saved submissions yet. Click "Save submission" to store this respondent's answers locally — useful when you're collecting responses from multiple people on this same computer.</p>`;
    return;
  }
  list.innerHTML = `<h3 style="font-family: var(--font-head);font-size:18px;margin:22px 0 10px;">Saved submissions (${subs.length})</h3>` +
    subs.map((s, i) => {
      const role = (s.responses.role && s.responses.role.value) || "—";
      const name = (s.responses.object_name && s.responses.object_name.valueText) || "—";
      const when = new Date(s.savedAt).toLocaleString();
      return `
      <div class="submission-item">
        <div class="submission-meta">
          <strong>#${i + 1}</strong> · ${escapeHtml(role)} · ${escapeHtml(name)} · <span class="muted">${escapeHtml(when)}</span>
        </div>
        <div class="submission-actions">
          <button class="btn" data-act="view" data-i="${i}">View</button>
          <button class="btn" data-act="delete" data-i="${i}">Delete</button>
        </div>
      </div>`;
    }).join("");

  list.querySelectorAll("button[data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const i = parseInt(b.dataset.i);
      const act = b.dataset.act;
      const subs = getSubmissions();
      if (act === "view") {
        const blob = JSON.stringify(subs[i], null, 2);
        const w = window.open();
        if (w) { w.document.write(`<pre style="font:13px ui-monospace,Menlo,monospace;padding:20px;white-space:pre-wrap;">${blob.replace(/</g,"&lt;")}</pre>`); }
        else { showToast("Pop-up blocked — try Export JSON"); }
      } else if (act === "delete") {
        if (confirm("Delete this submission?")) {
          subs.splice(i, 1);
          setSubmissions(subs);
          renderSubmissionsList();
          renderProgress();
        }
      }
    });
  });
}

function saveSubmission() {
  const subs = getSubmissions();
  subs.push({
    savedAt: new Date().toISOString(),
    responses: JSON.parse(JSON.stringify(state.responses))
  });
  setSubmissions(subs);
  showToast("Submission saved locally");
  renderSubmissionsList();
  renderProgress();
}

function resetCurrent() {
  if (!confirm("Clear the current answers (without deleting saved submissions)? Make sure you've saved this submission first.")) return;
  state.responses = {};
  state.hovered = {};
  state.sectionIdx = 0;
  state.viewMode = "form";
  saveState();
  render({ fromNav: true });
}

function clearAllSubmissions() {
  if (!confirm("Permanently delete ALL saved submissions? This can't be undone.")) return;
  setSubmissions([]);
  showToast("All submissions cleared");
  renderSubmissionsList();
  renderProgress();
}

function exportJson() {
  const payload = {
    exportedAt: new Date().toISOString(),
    current: state.responses,
    submissions: getSubmissions()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  downloadBlob(blob, `portfolio_maturity_assessment_full_${stamp()}.json`);
}

function exportCsv() {
  // One row per submission, one column per question id; current responses included as row "current"
  const subs = getSubmissions();
  const rows = [];
  const headers = ["submission_id", "saved_at"];
  const qids = [];
  DATA.sections.forEach(s => {
    if (!s.questions) return;
    s.questions.forEach(q => qids.push(q.id));
  });
  qids.forEach(id => headers.push(id));
  rows.push(headers);

  const all = subs.slice();
  // include current as last row if it has any data
  if (Object.keys(state.responses).length > 0) {
    all.push({ savedAt: "current (unsaved)", responses: state.responses });
  }

  all.forEach((sub, i) => {
    const row = [`#${i + 1}`, sub.savedAt];
    qids.forEach(id => {
      const r = sub.responses[id] || {};
      let v = "";
      if (Array.isArray(r.valueIndices) && r.valueIndices.length > 0) {
        v = (r.valueTitles || r.valueIndices.map(i => String(i+1))).join(" | ");
      } else if (typeof r.valueIndex === "number") v = `${r.valueIndex + 1}|${r.value || ""}`;
      else if (typeof r.value === "number") v = String(r.value);
      else if (r.valueText) v = r.valueText;
      row.push(v);
    });
    rows.push(row);
  });

  const csv = rows.map(r => r.map(csvCell).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  downloadBlob(blob, `portfolio_maturity_assessment_full_${stamp()}.csv`);
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}
function stamp() {
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function pad(n) { return String(n).padStart(2, "0"); }

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
